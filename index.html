  .header { position: relative; display: block; width: 100%; height: auto; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- кнопки ---------- */
  .actions {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(80%, 340px);
    margin: calc(var(--w) * 0.025) auto 0;
    padding-bottom: 48px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 62px;
    padding: 8px 22px 8px 8px;
    border: 0;
    border-radius: 999px;
    background: var(--olive);
    color: var(--cream);
    font: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
      0 12px 26px -10px rgba(30, 28, 6, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
    transition: background-color .2s, transform .12s;
  }
  .btn:hover { background: var(--olive-deep); }
  .btn:active { transform: scale(0.975); }
  .btn:focus-visible, .sheet button:focus-visible, .sheet a:focus-visible {
    outline: 3px solid var(--cream);
    outline-offset: 3px;
    box-shadow: 0 0 0 6px var(--olive);
  }
  .btn .ic {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--cream);
    color: var(--olive);
    display: grid; place-items: center;
  }
  .btn .ic svg { width: 22px; height: 22px; }
  .btn .t { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .btn .t b { font-weight: 500; font-size: clamp(17px, 4.6vw, 19px); letter-spacing: 0.01em; }
  .btn .t small { font-size: clamp(13px, 3.5vw, 14.5px); opacity: 0.78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- окно с номером ---------- */
  .sheet {
    width: var(--w);
    max-width: 100vw;
    margin: auto auto 0;
    padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
    border: 0;
    border-radius: 26px 26px 0 0;
    background: var(--cream);
    color: var(--olive);
  }
  .sheet::backdrop { background: rgba(30, 28, 8, 0.5); }
  .sheet[open] { animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet[open] { animation: none; } }

  .sheet .label { margin: 0; font-size: 15px; opacity: .75; text-align: center; }
  .sheet .num {
    display: block;
    margin: 4px 0 20px;
    font-size: clamp(28px, 8vw, 34px);
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.01em;
    color: var(--olive);
    text-decoration: none;
  }
  .sheet .row { display: flex; flex-direction: column; gap: 10px; }
  .sheet .sbtn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px;
    border-radius: 999px;
    font: inherit; font-size: 17px; font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid var(--olive);
    background: transparent;
    color: var(--olive);
    transition: background-color .2s;
  }
  .sheet .sbtn svg { width: 20px; height: 20px; }
  .sheet .sbtn:hover { background: var(--olive-soft); }
  .sheet .sbtn.primary { background: var(--olive); color: var(--cream); }
  .sheet .sbtn.primary:hover { background: var(--olive-deep); }
  .sheet .close {
    display: block; margin: 14px auto 0; padding: 10px 18px;
    background: none; border: 0; border-radius: 999px;
    font: inherit; font-size: 15px; color: var(--olive); opacity: .75; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    padding: 12px 20px;
    border-radius: 999px;
    background: var(--olive-deep); color: var(--cream);
    font-size: 15px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

  <nav class="actions" aria-label="Контакты">

      </span>
      <span class="t"><b>Телефон</b><small>Позвонить или скопировать</small></span>
    </button>

    <a class="btn" id="btn-ig" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>

    </a>

    <a class="btn" id="btn-wa" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>
      </span>
      <span class="t"><b>WhatsApp</b><small>Написать сообщение</small></span>
    </a>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-label">
  <p class="label" id="sheet-label">Наш номер</p>
  <a class="num" id="sheet-num" data-phone-text></a>
  <div class="row">
    <a class="sbtn primary" id="sheet-call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h3.2l1.6 4.2-2.1 1.4a11 11 0 0 0 7.2 7.2l1.4-2.1 4.2 1.6V19a1.8 1.8 0 0 1-1.9 1.8C10.4 20.3 3.7 13.6 3.2 5.4A1.8 1.8 0 0 1 5 3.5z"/></svg>
      Позвонить
    </a>
    <button class="sbtn" id="sheet-copy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
      Скопировать номер
    </button>
  </div>
  <button class="close" id="sheet-close" type="button">Закрыть</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const C = CONFIG;
  const digits = s => (s || "").replace(/\D/g, "");
  const $ = id => document.getElementById(id);

  // --- Телефон ---
  const phoneDigits = digits(C.phone);
  if (!phoneDigits) {
    $("btn-phone").remove();
  } else {
    const tel = "tel:+" + phoneDigits;
    document.querySelectorAll("[data-phone-text]").forEach(el => el.textContent = C.phone);
    $("sheet-num").href = tel;
    $("sheet-call").href = tel;

    const sheet = $("sheet");
    $("btn-phone").addEventListener("click", () => sheet.showModal());
    $("sheet-close").addEventListener("click", () => sheet.close());
    sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

    $("sheet-copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(C.phone);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = C.phone; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (_) {}
        ta.remove();
      }
      toast("Номер скопирован");
    });
  }

  // --- Instagram ---
  const ig = (C.instagram || "").replace(/^@/, "").trim();
  $("btn-ig").href = "https://www.instagram.com/" + ig;
  if (ig) document.querySelector("[data-ig-text]").textContent = "@" + ig;

  // --- WhatsApp ---
  const wa = digits(C.whatsapp);
  $("btn-wa").href = wa
    ? "https://wa.me/" + wa + (C.whatsappText ? "?text=" + encodeURIComponent(C.whatsappText) : "")
    : "https://www.whatsapp.com/";

  let t;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(t);
    t = setTimeout(() => el.classList.remove("show"), 1800);
  }
})();
</script>
